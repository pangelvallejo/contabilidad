# Construye el paquete portable para Windows (con Python incluido) y lo publica como lanzamiento.
# Se ejecuta al subir una etiqueta vX.Y.Z o manualmente (Actions → "Paquete portable Windows" → Run workflow),
# en cuyo caso la etiqueta se toma de app/__init__.py (VERSION) y se crea si no existe.
name: Paquete portable Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquete:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest -q
      - name: Construir paquete
        run: python herramientas/crear_paquete.py
      - name: Versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('app/__init__.py', encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar lanzamiento
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Versión ${{ steps.version.outputs.tag }}
          files: dist/Contabilidad-*-windows.zip
          generate_release_notes: true
